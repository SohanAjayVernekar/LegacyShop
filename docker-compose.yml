services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacyshop-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${MSSQL_PORT:-14330}:1433"
    volumes:
      - legacyshop_sql_data:/var/opt/mssql
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: legacyshop-web
    environment:
      LEGACYSHOP_DB_HOST: "db"
      LEGACYSHOP_DB_PORT: "1433"
      LEGACYSHOP_DB_NAME: "LegacyEcommerceDb"
      LEGACYSHOP_DB_USER: "sa"
      LEGACYSHOP_DB_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${WEB_PORT:-8040}:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  legacyshop_sql_data:
