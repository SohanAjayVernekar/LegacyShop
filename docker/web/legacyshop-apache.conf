<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /app/src/Ecommerce.Web

    MonoServerPath legacyshop "/usr/bin/mod-mono-server4"
    MonoApplications legacyshop "/:/app/src/Ecommerce.Web"

    <Location "/">
        SetHandler mono
        MonoSetServerAlias legacyshop
    </Location>

    <Directory "/app/src/Ecommerce.Web">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/legacyshop-error.log
    CustomLog ${APACHE_LOG_DIR}/legacyshop-access.log combined
</VirtualHost>
